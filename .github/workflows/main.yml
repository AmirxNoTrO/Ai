      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download offline voice model
        working-directory: proj/app/src/main/assets
        run: |
          curl -L --fail -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          rm model.zip
          uuidgen > vosk-model-small-en-us-0.15/uuid
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NoTrO-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
          
